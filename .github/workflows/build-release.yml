name: Build & Sign Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project source
        run: |
          unzip -o fotocaap-app.zip -d extracted_src
          
          # پیدا کردن مسیر دقیق پوشه‌ای که فایل gradlew در آن قرار دارد
          GRADLEW_DIR=$(find extracted_src -name "gradlew" -exec dirname {} \;)
          echo "Found gradlew in directory: $GRADLEW_DIR"
          
          if [ -z "$GRADLEW_DIR" ]; then
            echo "Error: gradlew could not be found anywhere in the zip file!"
            exit 1
          fi
          
          # انتقال تمام محتویات پوشه اصلی پروژه به دایرکتوری جاری اکشن
          cp -rf "$GRADLEW_DIR"/* . || true
          cp -rf "$GRADLEW_DIR"/.* . || true
          rm -rf extracted_src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "Error: gradlew was not copied correctly to root directory!"
            exit 1
          fi

      - name: Build Signed Release APK & AAB
        env:
          KEYSTORE_PATH: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fotocaap-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: fotocaap-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore
