name: Build & Sign Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project source
        run: |
          unzip -o fotocaap-app.zip -d extracted_src
          # انتقال تمام فایل‌ها از پوشه استخراج شده به پوشه جاری اکشن
          cp -rf extracted_src/fotocaap-app/* . || true
          cp -rf extracted_src/fotocaap-app/.* . || true
          rm -rf extracted_src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Grant execute permission for gradlew
        run: |
          # مطمئن شدن از وجود فایل gradlew و دادن دسترسی اجرایی به آن
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "Error: gradlew not found in root directory!"
            exit 1
          fi

      - name: Build Signed Release APK & AAB
        env:
          KEYSTORE_PATH: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fotocaap-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: fotocaap-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore
